name: End-to-end tests

# The module in the Dolibarr Docker stack, an invoice through its real
# lifecycle, deliveries to a local receiver (tests/e2e/run.sh). Also called
# by release.yml (workflow_call), which releases only when it passes.
on:
  workflow_dispatch:
  workflow_call:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  e2e:
    name: Dolibarr ${{ matrix.dolibarr }}, PHP ${{ matrix.php }}
    timeout-minutes: 25
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The combinations the Docker stack validates (its README, "Supported
        # versions"): the versions the module supports are these, from the
        # lowest to the latest.
        include:
          - dolibarr: '19.0.4'
            php: '7.4'
          - dolibarr: '19.0.4'
            php: '8.2'
          - dolibarr: '20.0.4'
            php: '8.2'
          - dolibarr: '21.0.4'
            php: '8.3'
          - dolibarr: '22.0.5'
            php: '8.4'
          - dolibarr: '23.0.4'
            php: '8.4'
          - dolibarr: '24.0.1'
            php: '8.5'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Only Docker is needed: every tool runs in a container. The empty
      # DOLI_SHA256 skips the check of a version other than the stack's default.
      - name: Run the end-to-end tests
        run: make e2e
        env:
          E2E_STACK_ENV: |
            DOLI_VERSION=${{ matrix.dolibarr }}
            DOLI_SHA256=
            PHP_VERSION=${{ matrix.php }}

      - name: Upload the deliveries received
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results-dolibarr${{ matrix.dolibarr }}-php${{ matrix.php }}
          path: var/e2e
          if-no-files-found: ignore
