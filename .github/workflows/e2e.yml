name: End-to-end tests

# The module in the Dolibarr Docker stack, an invoice through its real
# lifecycle, deliveries to a local receiver (tests/e2e/run.sh). Also called
# by release.yml (workflow_call), which releases only when it passes.
on:
  workflow_dispatch:
  workflow_call:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  e2e:
    name: End-to-end tests
    timeout-minutes: 20
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Only Docker is needed: every tool runs in a container.
      - name: Run the end-to-end tests
        run: make e2e

      - name: Upload the deliveries received
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: var/e2e
          if-no-files-found: ignore
